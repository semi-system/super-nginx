name: Docker Image CI

on:
  schedule:
    - cron: '0 17 * * *'
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # pinned to the commit a tag pointed at, not the tag itself: a mutable tag
      # can be repointed at new code, and the step below gets GITHUB_TOKEN with
      # packages:write. Bump by re-resolving the tag, never by moving back to it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: abxst/actions/strict@7b5519cb84515aef9ab76705e8edc64bfdd27135 # v4
        with:
          push: ${{ github.event_name != 'pull_request' }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
